appId: app.nightnova.browser
productName: NightNova
directories:
  output: release
  buildResources: build
asar: true
files:
  - out/**
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/.bin'
extraMetadata:
  main: out/main/index.js
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: NightNova-${version}-${arch}.${ext}
  identity: null
  darkModeSupport: true
dmg:
  title: ${productName}
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: NightNova-${version}-setup.${ext}
# Standalone no-installer target is selected with --win portable.
# Its own filename avoids accidentally distributing the NSIS installer.
portable:
  artifactName: NightNova-${version}-portable.${ext}
  requestExecutionLevel: user
  # Each run gets its own temporary extraction directory to avoid collision.
  unpackDirName: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
