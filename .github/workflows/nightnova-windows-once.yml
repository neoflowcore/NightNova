name: NightNova Windows Manual Acceptance
# ACTION ECONOMY STRICT: never run on a push. Generate EXE/artifact ONLY
# when the operator explicitly requests an installer or hands-on acceptance.
on:
  push:
    branches:
      - nightnova-windows-acceptance-20261028-one-shot
    paths:
      - .github/workflows/nightnova-windows-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightnova-windows-release
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows x64 build and installer
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Checkout NightNova source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies (one pass)
        shell: pwsh
        run: bun ci
      - name: Confirm Electron runtime and packaging assets
        shell: pwsh
        run: |
          if (!(Test-Path "node_modules/electron/dist/electron.exe")) {
            throw "Electron Windows binary not installed; inspect trusted lifecycle scripts."
          }
          node -e "console.log('Electron version', require('electron/package.json').version)"
      - name: TypeScript integration check (one pass)
        shell: pwsh
        run: npm run typecheck
      - name: Focused NightNova runtime tests
        shell: pwsh
        run: npx --no-install vitest run src/main/nightnova src/main/acp-detect.test.ts src/main/chatgpt-watch src/main/auth-support.test.ts
      - name: Build Electron and Windows NSIS
        shell: pwsh
        run: npm run package:win
      - name: Generate SHA256 release manifest
        shell: pwsh
        run: npm run release:manifest
      - name: Upload one Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NightNova-Windows-x64-Installer
          path: |
            release/NightNova-*-setup.exe
            release/NIGHTNOVA_RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
